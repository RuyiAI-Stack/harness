repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
        exclude: ^packages/dsh-triton-riscv/python/codex_agent/harness/cordis\.yml$
      # The retained SDK demo uses Harness's !!js tags. Parse only; never execute.
      - id: check-yaml
        alias: check-harness-sdk-yaml
        args: [--unsafe]
        files: ^packages/dsh-triton-riscv/python/codex_agent/harness/cordis\.yml$
      - id: check-json
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write
        language: system
        files: \.(js|ts|json|ya?ml|md)$
        exclude: (^|/)pnpm-lock\.yaml$
