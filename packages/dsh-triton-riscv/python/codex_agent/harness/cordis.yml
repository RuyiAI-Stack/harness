# Triton-RISCV domain services for the isolated SDK profile (0.1.2rc1).
# Keep the SDK JSON-RPC server: the Python client communicates through it.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

- id: llm-isrc
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      isrc-proxy:
        displayName: ISRC Responses Proxy
        apiKeyEnv: !!js process.env.DSH_API_KEY_ENV ?? 'ISRC_API_KEY'
        api: openai-responses
        baseURL: !!js process.env.ISRC_BASE_URL ?? 'https://llmapi.isrc.ac.cn/v1'
        models:
          - id: !!js process.env.DSH_MODEL ?? 'gpt-5.6-sol'
            name: !!js process.env.DSH_MODEL ?? 'gpt-5.6-sol'

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# The local demo platform mounts the same domain-policy module distributed by
# the installable dsh-triton-riscv bundle.
- id: triton-riscv-domain-policy
  name: './bundle/index.js'

# The Harness MCP client launches our Python server and registers its tools as
# mcp__triton_riscv__<tool-name> model-facing functions.
- id: mcp-triton-riscv
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: triton_riscv
    transport: stdio
    command: !!js process.env.TRITON_RISCV_MCP_PYTHON
    args: ['-I', '-m', 'codex_agent.harness.mcp_server']
    # The host scrubs credential-shaped ambient names. Forward only declared tool credentials.
    env: !!js >-
      (() => {
        const c = JSON.parse(process.env.TRITON_RISCV_CONFIG ?? '{}');
        const keys = ['TRITON_RISCV_CONFIG', 'TRITON_RISCV_STATE_DIR', 'TRITON_WORKBENCH_OWNER',
          'TRITON_RISCV_ALLOW_VALIDATION', 'TRITON_RISCV_ALLOW_REPAIR_APPLY',
          'TRITON_RISCV_ALLOW_DEVELOPMENT_APPLY', 'TRITON_RISCV_REQUIRE_REMOTE',
          'TRITON_RISCV_REQUIRE_APPROVED_VALIDATION', 'RISCV_HOST', 'RISCV_REPO',
          c.storage?.urlEnv ?? 'TRITON_MYSQL_URL',
          c.memory?.embedding?.apiKeyEnv ?? 'AGENT_EMBEDDING_API_KEY'];
        if (c.cache?.enabled) keys.push(c.cache.urlEnv ?? 'TRITON_REDIS_URL');
        if (c.queue?.enabled || c.indexing?.enabled) keys.push(c.queue?.urlEnv ?? 'TRITON_AMQP_URL');
        if (c.indexing?.enabled) keys.push(c.indexing.apiKeyEnv ?? 'TRITON_QDRANT_API_KEY',
          c.indexing.embedding?.apiKeyEnv ?? 'AGENT_EMBEDDING_API_KEY');
        return { TRITON_RISCV_REPO_ROOT: process.env.DSH_CWD ?? process.cwd(),
          TRITON_RISCV_REQUIRE_APPROVED_VALIDATION: '1',
          ...Object.fromEntries(keys.filter(k => process.env[k] !== undefined).map(k => [k, process.env[k]])) };
      })()
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    # A real Triton-RISCV compile/test commonly exceeds 30 seconds.
    toolCallTimeoutMs: 960000
    failOnStartupError: true
